<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astral Systems – Expense Claims</title>
<meta name="theme-color" content="#122018">
<script>try{var t=localStorage.getItem("astral_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}</script>
<style>
:root,[data-theme=light]{--ink:#122018;--ink2:#3b493e;--blue:#3a7bf9;--blue2:#6f9cf3;--blue3:#eaf1ff;--bg:#f2f5fa;--bg2:#e8eef9;--card:#ffffff;--line:#e3e8f1;--mute:#66756b;--ok:#0f7f5a;--okbg:#e2f6ee;--warn:#a85800;--warnbg:#fff1dc;--bad:#c0362c;--badbg:#fdeceb;--chip:#eef1f6;--glass:rgba(255,255,255,.82);--shadow:0 1px 2px rgba(18,32,24,.05),0 8px 28px rgba(18,32,24,.07);--r:20px;--purple:#5b3fc4;--purplebg:#ece8fb;color-scheme:light}
[data-theme=dark]{--ink:#e9f0ea;--ink2:#b9c6bd;--blue:#5b94ff;--blue2:#7aa7ff;--blue3:rgba(91,148,255,.14);--bg:#0b110e;--bg2:#111a15;--card:#141e18;--line:#223028;--mute:#8fa196;--ok:#3fd199;--okbg:rgba(63,209,153,.13);--warn:#f5b455;--warnbg:rgba(245,180,85,.13);--bad:#ff8078;--badbg:rgba(255,128,120,.13);--chip:#1b2820;--glass:rgba(20,30,24,.85);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);--purple:#b7a2ff;--purplebg:rgba(183,162,255,.14);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.5 "Inter","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:96px;transition:background .25s,color .25s;background-image:radial-gradient(900px 400px at 85% -120px,var(--blue3),transparent 70%)}
header{background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:8}
header .logo{height:34px;display:block;border-radius:8px}
[data-theme=dark] header .logo{background:#fff;padding:4px 8px}
header .sp{flex:1}
header select{padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;width:auto;max-width:230px}
header label{color:var(--mute)!important}
#who{color:var(--mute);font-weight:600;font-size:14px}
.badge{font-size:11px;background:var(--blue3);color:var(--blue);padding:4px 10px;border-radius:20px;font-weight:800;letter-spacing:.06em}
.themebtn{border:1px solid var(--line);background:var(--card);color:var(--ink);width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:17px;display:grid;place-items:center;transition:transform .15s}
.themebtn:hover{transform:rotate(15deg)}
nav{display:flex;gap:4px;padding:5px;margin:16px auto 0;width:max-content;max-width:calc(100% - 32px);background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow-x:auto}
nav button{border:0;background:none;padding:9px 18px;font:inherit;font-weight:700;color:var(--mute);cursor:pointer;border-radius:14px;white-space:nowrap;transition:all .15s}
nav button:hover{color:var(--ink)}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--blue),#5a8cff);box-shadow:0 4px 14px rgba(58,123,249,.4)}
main{max-width:1060px;margin:18px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{margin:0 0 12px;font-size:20px;letter-spacing:-.02em}h3{margin:0 0 8px;font-size:15px}
.sech{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin:24px 6px 10px;font-weight:800}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:5px;font-weight:700}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;font:inherit;background:var(--card);color:var(--ink);transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--mute);opacity:.7}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue3)}
input:disabled{background:var(--chip);color:var(--mute)}
button.btn{background:linear-gradient(135deg,var(--blue),#5a8cff);color:#fff;border:0;padding:12px 20px;border-radius:14px;font:inherit;cursor:pointer;font-weight:700;transition:transform .08s,box-shadow .2s}
button.btn:hover{box-shadow:0 6px 18px rgba(58,123,249,.4)}button.btn:active{transform:scale(.97)}
button.btn.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}button.btn.sec:hover{box-shadow:none;border-color:var(--blue2)}
button.btn.ok{background:var(--ok);color:#fff}[data-theme=dark] button.btn.ok{color:#05291d}
button.btn.bad{background:var(--bad);color:#fff}[data-theme=dark] button.btn.bad{color:#2a0805}
button.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
button.btn.sm{padding:7px 13px;font-size:13px;border-radius:11px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);padding:9px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:var(--bg2)}
td.n,th.n{text-align:right;white-space:nowrap}
.pill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:800}
.s-Draft{background:var(--chip);color:var(--mute)}.s-Submitted{background:var(--blue3);color:var(--blue)}
.s-Approved{background:var(--okbg);color:var(--ok)}.s-Rejected{background:var(--badbg);color:var(--bad)}.s-Paid{background:var(--purplebg);color:var(--purple)}
.flag{display:block;font-size:12px;color:var(--warn);background:var(--warnbg);border-radius:10px;padding:4px 10px;margin-top:5px;font-weight:600}
.flag.info{color:var(--blue);background:var(--blue3)}.flag.err{color:var(--bad);background:var(--badbg)}
.muted{color:var(--mute);font-size:13px}
.hero{background:linear-gradient(135deg,#0f1f15 0%,#1c3a29 50%,#25517a 120%);color:#fff;border-radius:28px;padding:24px;margin-bottom:16px;box-shadow:0 18px 40px rgba(15,31,21,.28);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.hero:before{content:"";position:absolute;right:-70px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(111,156,243,.55),transparent 68%)}
.hero:after{content:"";position:absolute;left:-60px;bottom:-110px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(63,209,153,.22),transparent 70%)}
.hero>*{position:relative;z-index:1}
.hero .hi{opacity:.85;font-size:15px;font-weight:600}.hero .lab{opacity:.65;font-size:11px;text-transform:uppercase;letter-spacing:.14em;margin-top:16px;font-weight:700}
.hero .amt{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.1}.hero .sub{opacity:.75;font-size:13px;margin-top:2px}
.hero .acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.hero .live{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hero .live span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;backdrop-filter:blur(6px)}
.cta{flex:2;min-width:160px;background:linear-gradient(135deg,#4a86ff,#3a7bf9);color:#fff;border:0;border-radius:16px;padding:15px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 8px 24px rgba(58,123,249,.55);transition:transform .1s}
.cta:active{transform:scale(.97)}
.cta2{flex:1;min-width:120px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:15px;font:inherit;font-weight:700;cursor:pointer;backdrop-filter:blur(6px)}
.items{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;gap:13px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);transition:background .15s}
.item:hover{background:var(--bg2)}.item:last-child{border-bottom:0}
.tile{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:21px;flex:none}
.t-travel{background:var(--blue3)}.t-subs{background:var(--warnbg)}.t-general{background:var(--okbg)}.t-mileage{background:var(--purplebg)}
.item .mid{flex:1;min-width:0}.item .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:800;white-space:nowrap}.item .acts{display:flex;gap:6px}
.item .dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--warnbg);color:var(--warn)}.chip.i{background:var(--blue3);color:var(--blue)}.chip.e{background:var(--badbg);color:var(--bad)}.chip.d{background:var(--chip);color:var(--mute)}
.empty{padding:34px;text-align:center;color:var(--mute)}
.iconbtn{border:0;background:var(--chip);color:var(--mute);border-radius:11px;width:34px;height:34px;cursor:pointer;font-size:14px}.iconbtn:hover{color:var(--bad)}
.sbar{position:fixed;left:0;right:0;bottom:0;background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:center;z-index:6}
.sbar>div{max-width:1060px;width:100%;display:flex;align-items:center;gap:12px}
.sbar .tot{flex:1}.sbar .btn{padding:14px 24px;font-size:16px}
.claimhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
/* tracker */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:8px;box-shadow:var(--shadow)}
.steps{display:flex;align-items:center;margin:12px 0 6px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:74px;text-align:center;font-size:11px;font-weight:700;color:var(--mute)}
.step i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--mute);font-style:normal;font-size:13px;border:2px solid var(--line)}
.step.done i{background:var(--blue);border-color:var(--blue);color:#fff}.step.done{color:var(--ink)}
.step.now i{border-color:var(--blue);color:var(--blue);background:var(--blue3);box-shadow:0 0 0 5px var(--blue3);animation:pulse 1.8s infinite}.step.now{color:var(--blue)}
.step.bad i{background:var(--bad);border-color:var(--bad);color:#fff}.step.bad{color:var(--bad)}
.step.fin i{background:var(--ok);border-color:var(--ok);color:#fff}.step.fin{color:var(--ok)}
.bar2{flex:1;height:3px;background:var(--line);border-radius:2px;margin-bottom:22px}.bar2.done{background:var(--blue)}
@keyframes pulse{50%{box-shadow:0 0 0 9px transparent}}
.statusmsg{font-weight:700;margin-top:2px}.statusmsg small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.modal{position:fixed;inset:0;background:rgba(5,12,8,.6);display:flex;align-items:flex-end;justify-content:center;overflow:auto;z-index:20;backdrop-filter:blur(4px)}
.modal>.card{width:100%;max-width:660px;margin:0;border-radius:28px 28px 0 0;max-height:94vh;overflow:auto;padding:22px;animation:up .25s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(50px);opacity:.3}to{transform:none;opacity:1}}
@media(min-width:700px){.modal{align-items:center;padding:20px}.modal>.card{border-radius:28px}}
.drop{border:2px dashed var(--blue2);border-radius:20px;padding:22px;text-align:center;background:var(--blue3);cursor:pointer;transition:transform .1s}.drop:hover{transform:scale(1.01)}
.drop.has{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.thumb{max-height:150px;max-width:100%;border-radius:12px;margin-top:10px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:22px;padding:8px 15px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hide{display:none!important}
.tot{font-size:22px;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}.kpi b{display:block;font-size:26px;letter-spacing:-.02em;margin-top:2px}
.scan{font-size:13px;margin-top:10px}.scan .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:5px}.scan .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--ok));width:0;transition:width .2s}
.tbl-wrap{overflow-x:auto}
a{color:var(--blue);font-weight:700;text-decoration:none}a:hover{text-decoration:underline}
.login{max-width:400px;margin:70px auto;text-align:center}.login img{height:60px;margin-bottom:12px;border-radius:10px}
[data-theme=dark] .login img{background:#fff;padding:8px 12px}
/* policy */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.pcard h3{display:flex;align-items:center;gap:10px;font-size:16px;margin-bottom:10px}.pcard h3 .tile{width:36px;height:36px;font-size:17px;border-radius:12px}
.pcard ul{margin:0;padding-left:18px;color:var(--ink2)}.pcard li{margin:5px 0}.pcard b{color:var(--ink)}
.big{font-size:26px;font-weight:800;letter-spacing:-.02em}
@media(max-width:699px){
 header{padding:8px 14px}header .logo{height:28px}header label{display:none}
 nav{position:fixed;bottom:0;left:0;right:0;width:auto;max-width:none;margin:0;border-radius:22px 22px 0 0;border-bottom:0;justify-content:space-around;z-index:7;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:0}
 nav button{padding:10px 6px;font-size:12px;flex:1}
 body{padding-bottom:150px}
 .hero .amt{font-size:36px}
 .sbar{bottom:62px}
}
</style>
</head>

<script>
/* Settings (Firebase, tenant, domain, attachments) live in config.js – edit that file, not this one. */
const LIVE = !!(window.FIREBASE_CONFIG && !/PASTE_/.test(window.FIREBASE_CONFIG.apiKey||''));
const TENANT = (window.AZURE_TENANT_ID && !/PASTE_/.test(window.AZURE_TENANT_ID)) ? window.AZURE_TENANT_ID : null;

const POLICY = {
  mealCaps:{Breakfast:15,Lunch:25,Dinner:35},
  hotelCap:{London:275,Rest:100},
  claimDays:30,
  mileage:{standard:0.55,reduced:0.25,threshold:10000}, // per Astral Systems mileage policy (HMRC approved rate is 45p – the excess over 45p is taxable, see policy section 6)
  hmrcStandard:0.45,
  departments:['Engineering','R&D','Commercial','Operations','Facilities','Finance','Admin','Other']
};
// Demo mode only. In live mode people sign in with Microsoft 365 and finance staff are listed in Firestore (see SETUP.md).
const USERS=[
  {id:'jiffin',name:'Jiffin Johnson',role:'Employee',dept:'Facilities'},
  {id:'amy',name:'Demo Colleague',role:'Employee',dept:'Engineering'},
  {id:'fin',name:'Finance Team',role:'Finance',dept:'Finance'},
  {id:'fin2',name:'Finance Colleague',role:'Finance',dept:'Finance'}
];
const ATT = LIVE ? (window.ATTACHMENTS||'firestore') : 'local';
const DOC_KINDS={receipt:'Receipt','bank':'Bank statement',invoice:'Invoice','approval':'Approval email',other:'Other'};
const MAX_FILE=10*1024*1024;
const TYPES={travel:'Travel',subs:'Subsistence',general:'General / Operational',mileage:'Mileage'};
const MODES=['Train','Bus','Taxi','Flight','Parking / Tolls','Other'];
const NATURES=['Meal','Accommodation','Other'];

/* ===================== HELPERS ===================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp=n=>'£'+(Number(n)||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB'):'';
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
const today=()=>new Date().toISOString().slice(0,10);
const daysBetween=(a,b)=>Math.floor((new Date(b)-new Date(a))/864e5);
function taxYearStart(d){const x=new Date(d);const y=x.getFullYear();return (x>=new Date(y,3,6))?`${y}-04-06`:`${y-1}-04-06`}

/* ===================== FILE HELPERS (pilot storage in Firestore) ===================== */
const PILOT_IMG_MAX=190*1024, PILOT_PDF_MAX=600*1024;
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
const b64ToBlob=(b64,mime)=>{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})};
async function compressForFirestore(blob){
  if(!blob.type.startsWith('image/')){if(blob.size>PILOT_PDF_MAX)throw new Error('PDF is too large for the pilot (max 600 KB). Please upload a photo instead.');return blob}
  const url=URL.createObjectURL(blob);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  let last=null;
  for(const [max,q] of [[1400,.72],[1200,.62],[1000,.55],[800,.5],[640,.45]]){
    const sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    last=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
    if(last&&last.size<=PILOT_IMG_MAX){URL.revokeObjectURL(url);return last}
  }
  URL.revokeObjectURL(url);
  if(last&&last.size<=650*1024)return last;
  throw new Error('Image could not be compressed enough for the pilot.');
}
function attachOK(f){
  if(ATT==='firestore'&&f.type==='application/pdf'&&f.size>PILOT_PDF_MAX){alert('PDFs must be under 600 KB in the pilot. Please upload a photo instead.');return false}
  return true;
}

/* ===================== STORAGE LAYER ===================== */
const Store=(()=>{
  const live=LIVE;
  if(!live){
    const KEY='astral_expense_claims_v2';
    const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('astral_expense_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
    return {live,
      async list(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}},
      async save(c){const all=await this.list();const i=all.findIndex(x=>x.id===c.id);if(i>=0)all[i]=c;else all.push(c);localStorage.setItem(KEY,JSON.stringify(all))},
      async remove(id){localStorage.setItem(KEY,JSON.stringify((await this.list()).filter(x=>x.id!==id)))},
      async putFile(path,blob){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(blob,path);t.oncomplete=()=>res(path);t.onerror=()=>rej(t.error)})},
      async fileURL(path){const d=await idb();return new Promise(res=>{const q=d.transaction('f').objectStore('f').get(path);q.onsuccess=()=>res(q.result?URL.createObjectURL(q.result):null);q.onerror=()=>res(null)})}
    };
  }
  // ---- Live mode: Firebase Auth (Microsoft 365) + Firestore + Storage ----
  let fb;
  const load=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s)});
  const init=async()=>{if(fb)return fb;const v='10.12.2',b=`https://www.gstatic.com/firebasejs/${v}/firebase-`;
    await load(b+'app-compat.js');await Promise.all([load(b+'auth-compat.js'),load(b+'firestore-compat.js'),...(ATT==='storage'?[load(b+'storage-compat.js')]:[])]);
    firebase.initializeApp(window.FIREBASE_CONFIG);fb={auth:firebase.auth(),db:firebase.firestore(),st:ATT==='storage'?firebase.storage():null};return fb};
  return {live,init,
    async signIn(){const {auth}=await init();const p=new firebase.auth.OAuthProvider('microsoft.com');
      p.setCustomParameters({prompt:'select_account',...(TENANT?{tenant:TENANT}:{})});p.addScope('email');p.addScope('profile');
      return auth.signInWithPopup(p)},
    async signOut(){const {auth}=await init();return auth.signOut()},
    async onUser(cb){const {auth}=await init();auth.onAuthStateChanged(cb)},

      if(ATT==='storage'){await st.ref(path).put(blob,{contentType:blob.type||'application/octet-stream'});return path}

        await db.collection('receiptFiles').doc(id).set({ownerId:owner,mime:b.type||'image/jpeg',data,created:Date.now()});return path}

/* ===================== RECEIPT SCANNING ===================== */
function parseReceipt(text){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const out={vendor:'',date:'',amount:'',currency:'GBP',vat:''};
  // vendor: first line with 3+ letters that isn't mostly digits
  out.vendor=(lines.find(l=>(l.match(/[A-Za-z]/g)||[]).length>=3&&!/receipt|invoice|tel|www\.|vat reg/i.test(l))||'').replace(/[^\w &'.\-]/g,'').trim().slice(0,60);
  // currency
  if(/€|EUR\b/.test(text))out.currency='EUR';else if(/\$|USD\b/.test(text))out.currency='USD';else out.currency='GBP';
  // amounts
  const numRe=/(?<![\d.,])(\d{1,3}(?:,\d{3})+|\d+)[.,](\d{2})(?![\d])/g;
  const toNum=m=>parseFloat(m[1].replace(/,/g,'')+'.'+m[2]);
  let best=null;
  for(const l of lines){
    if(/(grand\s*total|total\s*(due|paid|to pay)?|amount\s*(due|paid)|balance\s*due|to\s*pay)/i.test(l)&&!/sub\s*-?\s*total|vat|tax|change/i.test(l)){
      const ms=[...l.matchAll(numRe)];if(ms.length){best=toNum(ms[ms.length-1])}
    }
  }
  if(best==null){const all=[...text.matchAll(numRe)].map(toNum);if(all.length)best=Math.max(...all)}
  if(best!=null)out.amount=best.toFixed(2);
  // vat
  for(const l of lines){if(/vat|tax/i.test(l)&&!/reg|no\.?\s*\d{6}|number/i.test(l)){const ms=[...l.matchAll(numRe)];if(ms.length){out.vat=toNum(ms[ms.length-1]).toFixed(2);break}}}
  // date
  const mon={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  const iso=(y,m,d)=>{y=+y;if(y<100)y+=2000;m=+m;d=+d;if(m<1||m>12||d<1||d>31)return '';return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`};
  let m;
  if(m=text.match(/\b(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})\b/))out.date=iso(m[1],m[2],m[3]);
  else if(m=text.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/))out.date=iso(m[3],m[2],m[1]);
  else if(m=text.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3})[a-z]*\.?,?\s+(\d{2,4})\b/)){const mm=mon[m[2].toLowerCase()];if(mm)out.date=iso(m[3],mm,m[1])}
  // time of day -> meal guess
  const tm=text.match(/\b([01]?\d|2[0-3])[:.]([0-5]\d)(?:\s?(am|pm))?\b(?!\s?[\/-]\d)/i);
  if(tm&&/[:]/.test(tm[0])){let h=+tm[1];if(tm[3]){const pm=tm[3].toLowerCase()==='pm';if(pm&&h<12)h+=12;if(!pm&&h===12)h=0}
    out.meal=h<11?'Breakfast':h<16?'Lunch':'Dinner'}
  const lc=text.toLowerCase();
  if(/trainline|\brail\b|train|gwr|lner|avanti|crosscountry|northern|southeastern/.test(lc))out.mode='Train';
  else if(/uber|taxi|\bcab\b|bolt|addison lee|ola\b/.test(lc))out.mode='Taxi';
  else if(/stagecoach|national express|megabus|\bbus\b/.test(lc))out.mode='Bus';
  else if(/parking|ncp|ringo|paybyphone|\btoll|dart charge|congestion/.test(lc))out.mode='Parking / Tolls';
  else if(/ryanair|easyjet|british airways|jet2|airline|flight/.test(lc))out.mode='Flight';
  return out;
}
async function shrinkImage(file){
  if(!file.type.startsWith('image/'))return file;
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const max=1800,s=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.82));
}
let tessLoading=null;
function loadTesseract(){
  if(window.Tesseract)return Promise.resolve();
  return tessLoading||(tessLoading=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=res;s.onerror=()=>rej(new Error('OCR library could not load'));document.head.appendChild(s)}));
}
async function ocr(blob,onProgress){
  await loadTesseract();
  const r=await Tesseract.recognize(blob,'eng',{logger:m=>{if(m.status==='recognizing text')onProgress&&onProgress(m.progress)}});
  return r.data.text;
}

/* ===================== POLICY CHECKS ===================== */
function mileageSplit(miles,ytdBefore){
  const t=POLICY.mileage.threshold,std=Math.max(0,Math.min(miles,t-ytdBefore)),red=miles-std;
  return {std,red,amount:std*POLICY.mileage.standard+red*POLICY.mileage.reduced};
}
function checkLine(l,submittedOn){
  const f=[];const ref=submittedOn||today();
  if(!l.date)f.push(['err','Date missing']);
  else{
    if(l.date>today())f.push(['err','Date is in the future']);
    else if(daysBetween(l.date,ref)>POLICY.claimDays)f.push(['warn',`Older than ${POLICY.claimDays} days – needs finance exception`]);
  }
  if(l.type!=='mileage'&&ATT!=='none'){const d=l.docs||[];if(!d.some(x=>x.kind==='receipt')){f.push(['warn',d.length?'No receipt – supporting document only':'No receipt attached'])}}
  if(l.type==='mileage'&&POLICY.mileage.standard>POLICY.hmrcStandard)f.push(['info',`Rate above HMRC ${(POLICY.hmrcStandard*100).toFixed(0)}p – excess is taxable (payroll)`]);
  if(!(l.amountGBP>0))f.push(['err','Amount missing']);
  if(l.currency&&l.currency!=='GBP'&&!(l.fxAmount>0))f.push(['warn','Foreign currency: enter the original amount']);
  if(l.type==='subs'&&l.nature==='Meal'){const cap=POLICY.mealCaps[l.mealType];if(cap&&l.amountGBP>cap)f.push(['warn',`Over ${l.mealType.toLowerCase()} limit of ${gbp(cap)}`])}
  if(l.type==='subs'&&l.nature==='Accommodation'){const cap=l.london?POLICY.hotelCap.London:POLICY.hotelCap.Rest;if(l.amountGBP>cap)f.push(['warn',`Over nightly limit of ${gbp(cap)} – needs advance approval`])}
  if(l.type==='general'&&l.preApproved!=='Yes')f.push(['warn','No pre-approval recorded']);
  if(l.type==='travel'&&l.mode==='Taxi'&&!(l.purpose||'').trim())f.push(['warn','Taxi claims need a justification']);
  return f;
}
const lineDesc=l=>({travel:`${l.from||'?'} → ${l.to||'?'} (${l.mode||'Travel'})`,subs:`${l.nature||'Expense'}${l.nature==='Meal'?' – '+(l.mealType||''):''}: ${l.desc||''}`,general:`${l.item||''}${l.vendor?' – '+l.vendor:''}`,mileage:`${l.from||'?'} → ${l.to||'?'} · ${l.miles||0} mi`}[l.type]);
const claimTotal=c=>c.lines.reduce((s,l)=>s+(Number(l.amountGBP)||0),0);
const claimFlags=c=>c.lines.reduce((n,l)=>n+checkLine(l,c.submittedOn).filter(f=>f[0]!=='info').length,0);

const STEP_LABELS=['Submitted','Approved','Paid'];
function tracker(c){
  const idx={Submitted:0,Approved:1,Paid:2}[c.status];
  if(c.status==='Draft')return '';
  const rej=c.status==='Rejected';
  const msg={Submitted:['With finance – waiting for approval',`Submitted ${fmtDate(c.submittedOn)}`],
    Approved:['Approved – finance is processing your payment',`Approved ${fmtDate(c.decision&&c.decision.at)} · payment is normally made within 10 working days`],
    Paid:['Paid',`Paid ${fmtDate(c.paidOn)}`],
    Rejected:['Needs changes',`${c.decision&&c.decision.by?esc(c.decision.by)+': ':''}${esc(c.decision&&c.decision.note||'See note')}`]}[c.status];
  const st=(n,label)=>{let cls='';if(rej){cls=n===0?'done':n===1?'bad':''}else if(n<idx)cls='done';else if(n===idx)cls=c.status==='Paid'?'fin':'now';
    const ic=cls==='done'||cls==='fin'?'✓':cls==='bad'?'!':n+1;return `<div class="step ${cls}"><i>${ic}</i>${n===1&&rej?'Rejected':label}</div>`};
  const bars=n=>`<div class="bar2 ${(!rej&&n<idx)||(rej&&n===0)?'done':''}"></div>`;
  return `<div class="steps">${st(0,'Submitted')}${bars(0)}${st(1,'Approved')}${bars(1)}${st(2,'Paid')}</div><div class="statusmsg">${msg[0]}<small>${msg[1]}</small></div>`;
}

function mileageYTD(dateStr,excludeLineId){
  const start=taxYearStart(dateStr||today());let m=0;
  const consider=[...claims.filter(c=>c.employeeId===me.id&&c.status!=='Rejected'&&c.id!==draft.id),draft];
  consider.forEach(c=>c.lines.forEach(l=>{if(l.type==='mileage'&&l.id!==excludeLineId&&l.date>=start&&l.date<=(dateStr||today()))m+=+l.miles||0}));
  return m;
}

      <div id="mealWrap"><label>Meal</label><select id="mealType">${Object.keys(POLICY.mealCaps).map(m=>`<option ${m===l.mealType?'selected':''}>${m}</option>`)}</select></div>
      <div id="lonWrap" class="hide"><label>Location</label><select id="london"><option value="0">Rest of UK</option><option value="1" ${l.london?'selected':''}>London / Greater London</option></select></div>

    <div class="row f f-general"><div><label>Item description</label><input id="item" value="${esc(l.item||'')}" placeholder="e.g. Keyboard and mouse"></div><div><label>Vendor</label><input id="vendor" value="${esc(l.vendor||'')}"></div></div>

    <div class="row f f-notmileage" style="margin-top:8px"><div><label>Amount paid (original currency)</label><input type="number" min="0" step="0.01" id="fx" value="${l.fxAmount||l.amountGBP||''}"></div><div><label>Currency</label><select id="cur">${['GBP','EUR','USD','CAD','Other'].map(m=>`<option ${m===l.currency?'selected':''}>${m}</option>`)}</select></div><div id="gbpWrap" class="hide"><label>Amount in GBP (as charged to you)</label><input type="number" min="0" step="0.01" id="gbp" value="${l.currency!=='GBP'?l.amountGBP||'':''}"></div></div>
    <div id="mileInfo" class="muted hide" style="margin-top:8px"></div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><div>Line total: <span class="tot" id="lt">£0.00</span></div><div><button class="btn sec" id="cancel">Cancel</button> <button class="btn" id="ok">${isEdit?'Update':'Add to claim'}</button></div></div>
  </div></div>`;
  const g=id=>$('#'+id,root);
  const close=()=>{if(previewURL)URL.revokeObjectURL(previewURL);root.innerHTML=''};
  g('x').onclick=close;g('cancel').onclick=close;

  function sync(){
    root.querySelectorAll('.f').forEach(e=>{const show=e.classList.contains('f-'+l.type)||(l.type!=='mileage'&&e.classList.contains('f-notmileage'));e.classList.toggle('hide',!show)});
    g('rcpt').classList.toggle('hide',l.type==='mileage');
    g('mealWrap').classList.toggle('hide',g('nature').value!=='Meal');
    g('lonWrap').classList.toggle('hide',g('nature').value!=='Accommodation'||l.type!=='subs');
    g('gbpWrap').classList.toggle('hide',g('cur').value==='GBP'||l.type==='mileage');
    root.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===l.type));
    collect();
  }
  function collect(){
    l.date=g('date').value;l.purpose=g('purpose').value;
    l.from=g('from').value;l.to=g('to').value;l.mode=g('mode').value;
    l.nature=g('nature').value;l.mealType=g('mealType').value;l.london=g('london').value==='1';l.location=g('location').value;l.desc=g('desc').value;
    l.item=g('item').value;l.vendor=g('vendor').value;l.preApproved=g('pre').value;l.approver=g('approver').value;
    l.currency=g('cur').value;
    if(l.type==='mileage'){
      l.miles=parseFloat(g('miles').value)||0;const ytd=mileageYTD(l.date,l.id);g('ytd').value=ytd.toLocaleString();
      const s=mileageSplit(l.miles,ytd);l.amountGBP=+s.amount.toFixed(2);l.currency='GBP';l.fxAmount='';l.rate=s.red?'mixed':POLICY.mileage.standard;
      const mi=g('mileInfo');mi.classList.remove('hide');mi.textContent=l.miles?`${s.std.toLocaleString()} mi at ${(POLICY.mileage.standard*100).toFixed(0)}p${s.red?` + ${s.red.toLocaleString()} mi at ${(POLICY.mileage.reduced*100).toFixed(0)}p`:''} (rate applied automatically)`:'';
    }else{
      g('mileInfo').classList.add('hide');
      const fx=parseFloat(g('fx').value)||0;
      if(l.currency==='GBP'){l.amountGBP=fx;l.fxAmount=''}else{l.fxAmount=fx;l.amountGBP=parseFloat(g('gbp').value)||0}
    }
    g('lt').textContent=gbp(l.amountGBP);
    g('liveFlags').innerHTML=checkLine(l).map(([k,m])=>`<span class="flag ${k==='warn'?'':k}">${esc(m)}</span>`).join('');
  }
  root.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{l.type=b.dataset.t;sync()});
  root.querySelectorAll('input,select').forEach(e=>{if(e.id!=='file'){e.oninput=sync;e.onchange=sync}});

  l.docs=l.docs||[];
  function drawDocs(){
    const rc=l.docs.find(d=>d.kind==='receipt');
    g('drop').classList.toggle('has',!!rc);g('dropT').textContent=rc?'Receipt attached: '+rc.name+' (tap to replace)':'📷 Tap to scan receipt';
    g('docList').innerHTML=l.docs.filter(d=>d.kind!=='receipt').map(d=>`<div style="display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin-top:4px"><span>${DOC_KINDS[d.kind]}: ${esc(d.name)}</span><a href="#" data-rm="${d.id}">remove</a></div>`).join('');
    g('docList').querySelectorAll('[data-rm]').forEach(a=>a.onclick=e=>{e.preventDefault();l.docs=l.docs.filter(d=>d.id!==a.dataset.rm);drawDocs();sync()});
  }
  drawDocs();
  g('addDoc').onclick=()=>g('docfile').click();
  g('docfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
    if(!attachOK(f))return;if(f.size>MAX_FILE*2){alert('That file is too large (max 10 MB).');return}
    const b=await shrinkImage(f);if(b.size>MAX_FILE){alert('That file is too large (max 10 MB).');return}
    l.docs.push({id:'d_'+uid(),name:f.name,kind:g('dkind').value,mime:b.type||f.type,_blob:b});drawDocs();sync()};
  g('drop').onclick=e=>{if(e.target.id!=='file')g('file').click()};
  g('file').onchange=async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    if(!attachOK(f))return;if(f.size>MAX_FILE*2){alert('That file is too large (max 10 MB).');return}
    const scan=g('scan'),bar=g('bar'),st=g('scanT');scan.classList.remove('hide');st.textContent='Preparing receipt…';bar.style.width='5%';
    try{
      const blob=await shrinkImage(f);if(blob.size>MAX_FILE)throw new Error('file over 10 MB');
      if(ATT!=='none'){l.docs=l.docs.filter(d=>d.kind!=='receipt');l.docs.push({id:'d_'+uid(),name:f.name,kind:'receipt',mime:blob.type||f.type,_blob:blob});drawDocs()}else{g('drop').classList.add('has');g('dropT').textContent='Receipt read (image not kept in pilot)'}
      if(blob.type.startsWith('image/')){if(previewURL)URL.revokeObjectURL(previewURL);previewURL=URL.createObjectURL(blob);const t=g('thumb');t.src=previewURL;t.classList.remove('hide')}
      if(!blob.type.startsWith('image/')){st.textContent='PDF attached. Automatic reading works on photos – please type the details.';bar.style.width='100%';sync();return}
      st.textContent='Reading receipt… (first scan downloads the reader, ~10s)';
      const text=await ocr(blob,p=>{bar.style.width=Math.max(10,Math.round(p*100))+'%'});
      const r=parseReceipt(text);bar.style.width='100%';
      const filled=[];
      if(r.date&&!g('date').dataset.touched){g('date').value=r.date;filled.push('date')}
      if(r.amount){g('fx').value=r.amount;filled.push('amount')}
      if(r.currency){g('cur').value=r.currency;filled.push('currency')}
      if(r.vendor){if(l.type==='general'&&!g('vendor').value){g('vendor').value=r.vendor;filled.push('vendor')}else if(l.type==='subs'&&!g('desc').value){g('desc').value=r.vendor;filled.push('description')}}
      if(l.type==='subs'&&g('nature').value==='Meal'&&r.meal){g('mealType').value=r.meal;filled.push('meal type')}
      if(l.type==='travel'&&r.mode){g('mode').value=r.mode;filled.push('transport')}
      st.textContent=filled.length?`Read from receipt: ${filled.join(', ')}. Please check before adding.`:'Could not read this receipt clearly – please type the details.';
      sync();
    }catch(err){st.textContent='Scan unavailable ('+err.message+'). Receipt is attached – please type the details.';bar.style.width='0';sync()}
  };
  g('date').addEventListener('input',()=>g('date').dataset.touched=1);

  g('ok').onclick=async()=>{
    collect();
    if(!l.date||!(l.amountGBP>0)){alert('Please enter a date and an amount.');return}
    g('ok').disabled=true;
    try{
      if(l.type==='mileage')l.docs=[];
      for(const d of l.docs){if(d._blob){await Store.putFile(filePath(c.employeeId,d.id),d._blob);delete d._blob}}
      if(isEdit)c.lines[idx]=l;else c.lines.push(l);
      await Store.save(c);close();render();
    }catch(err){alert('Could not save: '+err.message);g('ok').disabled=false}
  };
  sync();
  if(opts.scan)g('file').click();
}

    me={id:u.uid,name:u.displayName||u.email,email:u.email,role:fin?'Finance':'Employee',isFinance:fin,dept:''};
    $('#who').textContent=`${me.name} · ${me.role}`;$('#out').style.display='';
    draft=null;view=navFor(me.role)[0][0];render();
  }).catch(e=>{$('#main').innerHTML='<div class="card"><b>Could not start.</b> '+esc(e.message)+'</div>'});
}
</script>
</body>
</html>
